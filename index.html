<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dodge Run</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0d1712;
  --card:#2d2e31;
  --hi:#47494e;
  --text:#ececee;
  --muted:#9da0a6;
  --good:#7fd69a;
}
*,*::before,*::after { box-sizing:border-box; }
html,body {
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  user-select:none;
}
#app {
  position:fixed;
  inset:0;
  touch-action:none;
  cursor:crosshair;
}
#app canvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.danger {
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 80px 14px rgba(255,50,50,.85);
  opacity:0;
}
.hud {
  position:absolute;
  left:calc(env(safe-area-inset-left,0px) + 14px);
  top:calc(env(safe-area-inset-top,0px) + 14px);
  padding:10px 16px;
  border-radius:16px;
  background:rgba(15,16,18,.62);
  backdrop-filter:blur(6px);
  pointer-events:none;
}
.hud b { font-size:30px; margin-right:6px; }
.hud span { font-size:11px; letter-spacing:.12em; color:var(--muted); }
.hud .lv {
  margin-top:2px;
  font-size:12px;
  font-weight:600;
  color:var(--good);
}
.best {
  position:absolute;
  right:calc(env(safe-area-inset-right,0px) + 14px);
  top:calc(env(safe-area-inset-top,0px) + 14px);
  padding:10px 16px;
  border-radius:16px;
  background:rgba(15,16,18,.62);
  backdrop-filter:blur(6px);
  font-size:11px;
  color:var(--muted);
  pointer-events:none;
}
.best b { font-size:18px; color:var(--text); margin-left:6px; }

.banner {
  position:absolute;
  left:0;
  right:0;
  top:28%;
  text-align:center;
  font-size:44px;
  font-weight:800;
  letter-spacing:.08em;
  opacity:0;
  pointer-events:none;
}
.banner.show { animation:pop 1.3s ease; }
.banner small {
  display:block;
  font-size:14px;
  color:#ffd36b;
  margin-top:4px;
}
@keyframes pop {
  0% { opacity:0; transform:scale(.7); }
  15% { opacity:1; transform:scale(1.05); }
  70% { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(1); }
}

.panel {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
  padding:24px;
  background:rgba(8,12,10,.55);
  backdrop-filter:blur(3px);
}
.panel.hide { display:none; }
.panel h1 {
  margin:0;
  font-size:44px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.panel p {
  margin:0;
  max-width:320px;
  color:#c4c7cd;
  line-height:1.55;
  font-size:15px;
}
.panel .big { font-size:64px; font-weight:800; }
.panel .sub { color:var(--muted); letter-spacing:.12em; font-size:12px; }
.panel .new { color:#ffd36b; font-weight:700; min-height:18px; }

button {
  margin-top:12px;
  padding:14px 34px;
  border:0;
  border-radius:999px;
  background:var(--hi);
  color:var(--text);
  font:600 16px inherit;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
button:hover { background:#5a5c63; }
button.ghost {
  background:transparent;
  margin-top:2px;
  padding:11px 30px;
  font-size:14px;
}
.panel.sheet {
  justify-content:flex-start;
  background:rgba(8,12,10,.1);
  backdrop-filter:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
}
.sheetbox {
  width:min(420px,100%);
  max-height:62vh;
  overflow-y:auto;
  background:rgba(22,23,26,.92);
  border-radius:24px;
  padding:18px 20px 8px;
  text-align:left;
}
.sheetbox h2 { margin:0 0 4px; font-size:18px; }
.opt { margin:14px 0; }
.opt label {
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
}
.sws { display:flex; gap:10px; flex-wrap:wrap; }
button.sw {
  width:38px;
  height:38px;
  padding:0;
  margin:0;
  border-radius:50%;
  border:2px solid transparent;
  box-shadow:none;
}
button.sw.sq { border-radius:12px; }
button.sw.on { border-color:#fff; }
.sheetbox #done { display:block; margin:12px auto 14px; }

/* OFF-SCREEN DEFENDER ARROWS */
.threat-arrow {
  position:absolute;
  z-index:10;
  color:#ff4545;
  font-size:28px;
  font-weight:900;
  text-shadow:0 0 12px red, 0 2px 5px black;
  pointer-events:none;
  transform-origin:center;
  line-height:1;
}

.hud .cn{color:#ffd36b}
.pups{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:12}
.pups button{pointer-events:auto;margin:0;padding:10px 16px;font-size:18px;border-radius:999px;background:rgba(30,32,36,.88);backdrop-filter:blur(6px);border:2px solid transparent;touch-action:manipulation}
.pups button.eq{border-color:#ffd36b}
.pups button small{font-size:12px;opacity:.75;margin-left:4px}
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
button:disabled{opacity:.4;cursor:default}
.pic{width:56px;height:70px;flex:none;border-radius:12px;background:rgba(255,255,255,.06);object-fit:contain}
.dot{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:11}
.shoprow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.shoprow .t{flex:1;font-size:14px}
.shoprow .t small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.shoprow button{margin:0;padding:8px 12px;font-size:13px;box-shadow:none}
.shoprow button.eqb.on{background:#ffd36b;color:#222}
.sheetbox .coinline{color:#ffd36b;font-size:13px;margin-bottom:6px}

@media (prefers-reduced-motion:reduce) {
  .banner.show { animation:none; opacity:1; }
}
</style>
</head>

<body>
<div id="app">
  <div class="danger" id="danger"></div>
  <div class="hud">
    <div><b id="yd">0</b><span>YARDS</span></div>
    <div class="lv" id="lv">LEVEL 1</div>
    <div class="lv cn" id="cn">🪙 0</div>
  </div>
  <div class="best">BEST<b id="best">0</b></div>
  <div class="fx" id="fx"></div>
  <div class="flash" id="flash"></div>
  <div class="banner" id="banner"></div>
  <div class="pups" id="pups"></div>
  <div class="panel" id="panel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);

const app = $('#app');
const panel = $('#panel');

if (!window.THREE) {
  panel.innerHTML = '<h1>Dodge Run</h1><p>The 3D engine could not load. Check your connection and reload.</p>';
  throw new Error('three.js missing');
}

let best = 0;
try { best = +localStorage.getItem('dodgeBest') || 0; } catch(e) {}
$('#best').textContent = best;

/* WIDER FIELD */
const FX = 60, BG = 0x0d1712;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG,45,95);

const cam = new THREE.PerspectiveCamera(60,1,.1,120);
const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
app.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8dcff,0x1d3a26,.95));

const sun = new THREE.DirectionalLight(0xffffff,.8);
sun.position.set(6,14,8);
scene.add(sun);

/* STADIUM */

const mkTex = (w,h,fn) => {
  const k = document.createElement('canvas');
  k.width=w; k.height=h;
  fn(k.getContext('2d'));
  const t = new THREE.CanvasTexture(k);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
};

const turf = mkTex(64,128,g => {
  g.fillStyle='#34703f';
  g.fillRect(0,0,64,64);
  g.fillStyle='#2b6137';
  g.fillRect(0,64,64,64);
});
turf.repeat.set(1,10);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(FX+6,140),
  new THREE.MeshLambertMaterial({map:turf})
);
ground.rotation.x=-Math.PI/2;
ground.position.z=-50;
scene.add(ground);

const crowd = mkTex(128,32,g => {
  g.fillStyle='#15181d';
  g.fillRect(0,0,128,32);
  for(let i=0;i<420;i++){
    g.fillStyle=['#c0504d','#e8c46a','#6aa0e8','#ececee','#7fd69a'][rnd(5)];
    g.globalAlpha=.35+Math.random()*.6;
    g.fillRect(rnd(128),rnd(32),2,2);
  }
});

crowd.repeat.set(5,1);
const crowd2=crowd.clone();
crowd2.needsUpdate=true;

[[-(FX/2+4.2),Math.PI/2,crowd,1],
 [FX/2+4.2,-Math.PI/2,crowd2,-1]].forEach(([sx,ry,t,sg])=>{
  const g=new THREE.Group();
  const m=new THREE.Mesh(
    new THREE.PlaneGeometry(140,8),
    new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide})
  );
  m.rotation.y=ry;
  g.add(m);
  g.position.set(sx,2.16,-50);
  g.rotation.z=sg;
  scene.add(g);
});

const white = new THREE.MeshBasicMaterial({color:0xffffff});

[-1,1].forEach(s=>{
  const l=new THREE.Mesh(new THREE.PlaneGeometry(.3,140),white);
  l.rotation.x=-Math.PI/2;
  l.position.set(s*FX/2,.02,-50);
  scene.add(l);
});

const yl=Array.from({length:12},(_,i)=>{
  const m=new THREE.Mesh(
    new THREE.PlaneGeometry(FX,.22),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5})
  );
  m.rotation.x=-Math.PI/2;
  m.position.set(0,.02,8-i*10);
  scene.add(m);
  return m;
});

const poles=[];
[-1,1].forEach(s=>{
  for(let i=0;i<6;i++){
    const g=new THREE.Group();
    const p=new THREE.Mesh(
      new THREE.CylinderGeometry(.12,.16,9,6),
      new THREE.MeshLambertMaterial({color:0x555a62})
    );
    const b=new THREE.Mesh(
      new THREE.BoxGeometry(1.6,.5,.5),
      new THREE.MeshBasicMaterial({color:0xfff3c4})
    );
    p.position.y=4.5;
    b.position.y=9.2;
    g.add(p,b);
    g.position.set(s*(FX/2+1.6),0,8-i*20);
    scene.add(g);
    poles.push(g);
  }
});

const scroll=wz=>{
  turf.offset.y+=wz/14;
  crowd.offset.x+=wz/28;
  crowd2.offset.x-=wz/28;
  yl.forEach(m=>{
    m.position.z+=wz;
    if(m.position.z>8)m.position.z-=120;
  });
  poles.forEach(p=>{
    p.position.z+=wz;
    if(p.position.z>8)p.position.z-=120;
  });
};

/* PLAYERS */

const mat=col=>new THREE.MeshLambertMaterial({color:col});

const jMat={
  me:mat(0x2b7fff),
  red:new THREE.MeshLambertMaterial({color:0xd63a32,emissive:0x330808}),
  fast:new THREE.MeshLambertMaterial({color:0xe8b030,emissive:0x2e2204}),
  brute:new THREE.MeshLambertMaterial({color:0x7b3fa8,emissive:0x1a0b28}),
  tired:mat(0x6d4b4a),
  pink:new THREE.MeshLambertMaterial({color:0xff4fa8,emissive:0x3a0820}),
  zig:new THREE.MeshLambertMaterial({color:0x22d3ee,emissive:0x04303a}),
  ghost:new THREE.MeshLambertMaterial({color:0xe8f4ff,emissive:0x1a2530,transparent:true}),
  split:new THREE.MeshLambertMaterial({color:0xf08a24,emissive:0x3a1c04}),
  tele:new THREE.MeshLambertMaterial({color:0x35d07f,emissive:0x08301c}),
  layer:new THREE.MeshLambertMaterial({color:0xa87a45,emissive:0x2a1c0a}),
  mag:new THREE.MeshLambertMaterial({color:0x5a6cff,emissive:0x0c1240}),
  stomp:new THREE.MeshLambertMaterial({color:0x3a3c44,emissive:0x5a1c00}),
  zapper:new THREE.MeshLambertMaterial({color:0xc8ff3a,emissive:0x2a3a04}),
  smoker:new THREE.MeshLambertMaterial({color:0x59606e,emissive:0x14161b}),
  giant:new THREE.MeshLambertMaterial({color:0x5f7d44,emissive:0x0e1a08}),
  mech:new THREE.MeshLambertMaterial({color:0x9aa5b4,emissive:0x1a1f26}),
  earth:new THREE.MeshLambertMaterial({color:0x5a4631,emissive:0x5a2c00})
};

const pantsW=mat(0xeeeeee);
const pantsD=mat(0x2a2a2e);
const helmW=mat(0xf2f2f2);
const helmD=mat(0x1d1f24);

const gBody=new THREE.BoxGeometry(1,1.15,.6);
const gHead=new THREE.SphereGeometry(.4,12,10);
const gLimb=new THREE.BoxGeometry(.34,1,.36);
const gArm=new THREE.BoxGeometry(.28,.95,.3);
const gShadow=new THREE.CircleGeometry(.9,16);
const mShadow=new THREE.MeshBasicMaterial({
  color:0x000000,transparent:true,opacity:.35
});

function mkPlayer(jm,hm,pm,sc){
  const g=new THREE.Group();
  const body=new THREE.Mesh(gBody,jm);
  const head=new THREE.Mesh(gHead,hm);

  body.position.y=1.6;
  head.position.y=2.5;

  const legs=[-.25,.25].map(px=>{
    const p=new THREE.Group();
    const l=new THREE.Mesh(gLimb,pm);
    p.position.set(px,1.05,0);
    l.position.y=-.5;
    p.add(l);
    g.add(p);
    return p;
  });

  const arms=[-.68,.68].map(px=>{
    const p=new THREE.Group();
    const a=new THREE.Mesh(gArm,jm);
    p.position.set(px,2.05,0);
    a.position.y=-.45;
    p.add(a);
    g.add(p);
    return p;
  });

  g.add(body,head);
  g.scale.setScalar(sc);

  const sh=new THREE.Mesh(gShadow,mShadow);
  sh.rotation.x=-Math.PI/2;
  sh.position.y=.03;
  sh.scale.setScalar(sc);

  const root=new THREE.Group();
  root.add(g,sh);
  root.userData={g,body,legs,arms};
  return root;
}

const tire=l=>{
  if(l.mk){scene.remove(l.mk);l.mk=null;}
  const u=l.mesh.userData;
  u.body.material=jMat.tired;
  u.arms.forEach(a=>a.children[0].material=jMat.tired);
};

const me3=mkPlayer(jMat.me,helmW,pantsW,1);
scene.add(me3);

const ring=new THREE.Mesh(
  new THREE.RingGeometry(1.15,1.45,28),
  new THREE.MeshBasicMaterial({
    color:0x7be3ff,
    transparent:true,
    opacity:.8,
    side:THREE.DoubleSide
  })
);
ring.rotation.x=-Math.PI/2;
ring.position.y=.06;
me3.add(ring);

const ball=new THREE.Mesh(
  new THREE.SphereGeometry(.4,10,8),
  mat(0x7a4b2a)
);
ball.scale.set(.55,.55,1);
ball.position.set(-.1,-.7,-.4);
me3.userData.arms[1].add(ball);

const nt=mkTex(64,64,g=>{
  g.font='800 50px system-ui';
  g.textAlign='center';
  g.fillStyle='#fff';
  g.fillText('7',32,50);
});

const np=new THREE.Mesh(
  new THREE.PlaneGeometry(.7,.7),
  new THREE.MeshBasicMaterial({map:nt,transparent:true})
);
np.position.set(0,1.65,.31);
me3.userData.g.add(np);

const gSpark=new THREE.BoxGeometry(.22,.22,.22);
const mSpark=[
  new THREE.MeshBasicMaterial({color:0xff6a5e}),
  new THREE.MeshBasicMaterial({color:0xffd36b})
];

/* STATE */

let run=false,over=false,yd=0,lvl=1,last=0,spawn=0;
let lbs=[],parts=[],shake=0,fall=0,tm=0,camX=0;
let hk='',camH=28,camHW=10,spawnZ=-46;

/* ARROW STORAGE */
const indicators=new Map();

const me={x:0,z:-8};
const tgt={x:0,z:-8};

const levelOf=y=>1+Math.floor(y/25);

const resize=()=>{
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  cam.aspect=w/h;
  cam.fov=cam.aspect<1?66:56;
  cam.updateProjectionMatrix();
  const th=Math.tan(cam.fov*Math.PI/360)*cam.aspect;
  camHW=camH*1.06*th;
};

addEventListener('resize',resize);
resize();

/* MOVEMENT */

const ray=new THREE.Raycaster();
const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const pt3=new THREE.Vector3();
const nd=new THREE.Vector2();

const aim=e=>{
  nd.set(
    e.clientX/innerWidth*2-1,
    -(e.clientY/innerHeight)*2+1
  );
  ray.setFromCamera(nd,cam);

  if(ray.ray.intersectPlane(plane,pt3)){
    const hx=FX/2-.6;
    tgt.x=Math.max(-hx,Math.min(hx,pt3.x));
    tgt.z=Math.max(-31,Math.min(-3,pt3.z));
  }
};

app.addEventListener('pointermove',aim);
let lastTap=0,lastTx=0,lastTy=0;
app.addEventListener('pointerdown',e=>{
  /* Ignore presses on menus/buttons. Capturing the pointer on #app made
     the browser retarget the click away from the button on desktop. */
  if(e.target.closest('button,.panel'))return;
  try{app.setPointerCapture(e.pointerId);}catch(_){}
  aim(e);
  const t=performance.now();
  if(t-lastTap<320&&Math.hypot(e.clientX-lastTx,e.clientY-lastTy)<60){
    useEq();
    lastTap=0;
  }else{
    lastTap=t;lastTx=e.clientX;lastTy=e.clientY;
  }
});

/* CRASH */

const crash=()=>{
  for(let i=0;i<40;i++){
    const m=new THREE.Mesh(gSpark,mSpark[i%2]);
    m.position.set(me.x,1.5,me.z);
    scene.add(m);
    parts.push({
      m,
      vx:(Math.random()-.5)*12,
      vy:Math.random()*9+3,
      vz:(Math.random()-.5)*12,
      life:1
    });
  }
};

const banner=(t,s)=>{
  const b=$('#banner');
  b.innerHTML=t+(s?'<small>'+s+'</small>':'');
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
};

const NEW={
  4:'Pink dashers incoming',
  6:'Cyan weavers zigzag',
  7:'Lime zappers shock you up close',
  8:'Ghosts fade in and out',
  9:'Yellow sprinters incoming',
  10:'Smokers throw vision-blocking bombs',
  11:'Orange splitters',
  13:'Green blinkers teleport',
  15:'Bruisers and mine layers',
  17:'Magnets pull you in',
  16:'Giants: huge and slow',
  19:'Stompers and Mechs arrive',
  23:'Earthbenders raise mountains'
};

/* CUSTOMIZATION */

let skin={jersey:0,helmet:0,turf:0,ring:0,def:0};

try{
  Object.assign(skin,JSON.parse(localStorage.getItem('dodgeSkin')||'{}'));
}catch(e){}

const OPT={
  jersey:['Jersey',[
    ['Blue',0x2b7fff],['Teal',0x14b8a6],
    ['Pink',0xec5fa8],['Orange',0xf08a24],
    ['White',0xe8e8ec],['Black',0x23252a]
  ]],
  helmet:['Helmet',[
    ['White',0xf2f2f2],['Black',0x1d1f24],
    ['Gold',0xe8b030],['Blue',0x2b7fff],
    ['Red',0xd63a32]
  ]],
  ring:['Glow',[
    ['Cyan',0x7be3ff],['Pink',0xff6ad5],
    ['Lime',0x9dff6a],['Gold',0xffd36b],
    ['White',0xffffff]
  ]],
  def:['Defenders',[
    ['Red',0xd63a32,0x330808],
    ['Navy',0x2d4fd6,0x081033],
    ['Maroon',0x8f2b45,0x240a12],
    ['Charcoal',0x4a4d55,0x0c0d10]
  ]],
  turf:['Turf',[
    ['Classic','#34703f','#2b6137',0xffffff],
    ['Night','#1f4a3a','#173a2d',0xcfe8dc],
    ['Snow','#dfe7ee','#c9d4de',0x7d8b99],
    ['Desert','#c8a468','#b8945a',0xfff2d0],
    ['Neon','#2a1650','#20103f',0xff6ad5]
  ]]
};

const pick=k=>OPT[k][1][skin[k]]||OPT[k][1][0];

function applySkin(){
  jMat.me.color.setHex(pick('jersey')[1]);
  helmW.color.setHex(pick('helmet')[1]);
  ring.material.color.setHex(pick('ring')[1]);

  const d=pick('def');
  jMat.red.color.setHex(d[1]);
  jMat.red.emissive.setHex(d[2]);

  const t=pick('turf');
  const g=turf.image.getContext('2d');
  g.fillStyle=t[1];
  g.fillRect(0,0,64,64);
  g.fillStyle=t[2];
  g.fillRect(0,64,64,64);
  turf.needsUpdate=true;

  yl.forEach(m=>m.material.color.setHex(t[3]));

}

function customize(){

    '<div class="opt"><label>'+OPT[k][0]+'</label><div class="sws">'+

    }).join('')+

  ).join('');

  panel.className='panel sheet';

/* OFF-SCREEN DEFENDER ARROWS */

function updateArrows(){
  const active=new Set(lbs);

  for(const [l,el] of indicators){
    if(!active.has(l)){
      el.remove();
      indicators.delete(l);
    }
  }

  for(const l of lbs){
    let el=indicators.get(l);

    if(!el){
      el=document.createElement('div');
      el.className='threat-arrow';
      el.textContent='▲';
      app.appendChild(el);
      indicators.set(l,el);
    }

    if(!run){
      el.style.display='none';
      continue;
    }

    const p=new THREE.Vector3(l.x,1.5,l.z);
    p.project(cam);

    const behind=p.z>1;

    let dx=p.x;
    let dy=-p.y;

    if(behind){
      dx=-dx;
      dy=-dy;
    }

    const offscreen=
      Math.abs(dx)>1 ||
      Math.abs(dy)>1 ||
      behind ||
      p.z < -1;

    if(!offscreen){
      el.style.display='none';
      continue;
    }

    const length=Math.hypot(dx,dy)||1;
    dx/=length;
    dy/=length;

    const margin=32;
    const cx=innerWidth/2;
    const cy=innerHeight/2;

    const tx=(cx-margin)/Math.max(.0001,Math.abs(dx));
    const ty=(cy-margin)/Math.max(.0001,Math.abs(dy));
    const t=Math.min(tx,ty);

    const px=cx+dx*t;
    const py=cy+dy*t;

    const angle=Math.atan2(dy,dx)*180/Math.PI+90;

    el.style.display='block';
    el.style.left=px+'px';
    el.style.top=py+'px';
    el.style.transform=
      'translate(-50%,-50%) rotate('+angle+'deg)';
  }
}

/* PINK DASHER AI
   Returns true while winding up or dashing (overrides normal chase),
   false while jogging (normal slow chase applies). */
function pinkAI(l,dt,EZ,ax,az,m){
  const u=l.mesh.userData;

  if(l.ds===0){                         // jogging
    l.dcd-=dt;
    u.g.scale.setScalar(l.sc);
    if(l.dcd>0)return false;
    l.ds=1;                             // start wind-up
    l.dt2=.55+.5*(1-EZ);
  }

  if(l.ds===1){                         // telegraph: stop, pulse, track you
    l.dt2-=dt;
    const f=Math.max(0,1-8*dt);
    l.vx*=f;
    l.vz*=f;
    u.g.scale.setScalar(l.sc*(1+.14*Math.sin(l.age*45)));
    l.dx=ax/m;
    l.dz=az/m;
    if(l.dt2<=0){
      l.ds=2;
      l.dt2=.6;
    }
    return true;
  }

  // dash
  const D=(12+Math.min(6,yd/60))*(.75+.25*EZ);
  l.vx=l.dx*D;
  l.vz=l.dz*D;
  u.g.scale.setScalar(l.sc);
  l.dt2-=dt;
  if(l.dt2<=0){
    l.ds=0;
    l.dcd=2.2+Math.random()*1.6+(1-EZ)*1.2;
  }
  return true;
}

function pickKind(){
  const P=[['std',3]];
  if(yd>75)P.push(['pink',1.2]);
  if(yd>125)P.push(['zig',1.2]);
  if(yd>150)P.push(['zapper',1]);
  if(yd>175)P.push(['ghost',1]);
  if(yd>200)P.push(['fast',1.2]);
  if(yd>225)P.push(['smoker',.9]);
  if(yd>250)P.push(['split',1]);
  if(yd>300)P.push(['tele',1]);
  if(yd>350)P.push(['brute',.8],['layer',.9]);
  if(yd>400)P.push(['mag',.8]);
  if(yd>375)P.push(['giant',.7]);
  if(yd>450)P.push(['stomp',.7],['mech',.8]);
  if(yd>550)P.push(['earth',.8]);
  let t=Math.random()*P.reduce((a,p)=>a+p[1],0);
  for(const p of P){t-=p[1];if(t<=0)return p[0];}
  return 'std';
}

    const th=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.9,8),dark);

  visor.position.set(0,2.55,.36);

  cannon.rotation.x=Math.PI/2;

function mkEnemy(kind,x,z){
  const T=TYPES[kind]();
  const l={
    x,z,vx:0,vz:0,
    k:T.k,
    r:T.r*(.8+Math.min(.2,yd/400)),
    fade:Math.random()<Math.max(.2,.5-yd/400),
    pred:Math.random()<.5,
    age:0,kind,sc:T.sc,
    ds:0,dt2:0,
    dcd:2+Math.random()*1.5,
    dx:0,dz:0,
    ph0:Math.random()*6.28,
    tc:1.5+Math.random()*1.5,
    life:4+Math.random()*6+Math.min(4,yd/40),
    ph:0,
    mesh:mkPlayer(T.m,helmD,pantsD,T.sc)
  };
  if(kind==='layer'||kind==='mag'||kind==='stomp'||kind==='tele')l.life+=4;
  if(kind==='smoker')l.life+=12;
  if(kind==='mech'||kind==='earth')l.life+=10;
  if(kind==='mini'){l.life=3.5;l.fade=false;}
  if(kind==='mag'){
    const rg=new THREE.Mesh(
      new THREE.RingGeometry(8.7,9,48),

    );

/* Per-type behaviour. Returns true if it fully controls movement this
   frame (winding up, dashing, etc.), false to use the normal chase. */
function special(l,dt,EZ,ax,az,m){
  const u=l.mesh.userData;
  switch(l.kind){

  case 'zapper':{                      // shocks you when close (3s cooldown)
    l.zc=(l.zc||0)-dt;
    const dz0=Math.hypot(me.x-l.x,me.z-l.z);
    if(dz0<ZAP_R&&l.zc<=0){
      stun=.1;
      l.zc=3;
      zigzag(l.x,1.8,l.z,me.x,1.8,me.z,5,1.4,.2,0xfff25a,.25);
    }
    return false;
  }

  case 'smoker':{                      // lobs smoke bombs (10s cooldown)
    if(l.ds===0){
      l.tc-=dt;
      u.g.scale.setScalar(l.sc);
      if(l.tc>0||l.z<-34)return false;
      l.ds=1;
      l.dt2=.5;
    }
    l.dt2-=dt;
    const sf=Math.max(0,1-8*dt);
    l.vx*=sf;l.vz*=sf;
    u.g.scale.setScalar(l.sc*(1+.1*Math.sin(l.age*40)));
    if(l.dt2<=0){
      throwBomb(l);
      l.ds=0;
      l.tc=10;
      u.g.scale.setScalar(l.sc);
    }
    return true;
  }

  case 'mech':{                        // aims with a laser, then fires a long-range shot
    if(l.ds===0){
      l.tc-=dt;
      u.g.scale.setScalar(l.sc);
      if(l.tc>0||l.z<-36)return false;
      if(Math.hypot(me.x-l.x,me.z-l.z)>34)return false;
      l.ds=1;
      l.dt2=.8+.4*(1-EZ);
      const ln=new THREE.Mesh(
        new THREE.BoxGeometry(.14,.06,36),
        new THREE.MeshBasicMaterial({color:0xff3a3a,transparent:true,opacity:.35})
      );
      scene.add(ln);
      l.mk=ln;
    }
    l.dt2-=dt;
    const mf=Math.max(0,1-8*dt);
    l.vx*=mf;l.vz*=mf;
    if(l.dt2>.25){                    // tracks you, then locks the aim
      const adx=me.x-l.x,adz=me.z-l.z,ad=Math.hypot(adx,adz)||1;
      l.dx=adx/ad;l.dz=adz/ad;
    }else if(l.mk){
      l.mk.material.opacity=.85;
    }
    if(l.mk){
      l.mk.position.set(l.x+l.dx*18,1.8,l.z+l.dz*18);
      l.mk.rotation.y=Math.atan2(l.dx,l.dz);
    }
    u.g.scale.setScalar(l.sc*(1+.05*Math.sin(l.age*40)));
    if(l.dt2<=0){
      fireShot(l,l.dx,l.dz);
      if(l.mk){scene.remove(l.mk);l.mk=null;}
      l.ds=0;
      l.tc=4+Math.random()*1.5+(1-EZ)*1.5;
      u.g.scale.setScalar(l.sc);
    }
    return true;
  }

  case 'earth':{                       // raises mountains ahead of you
    if(l.ds===0){
      l.tc-=dt;
      u.g.scale.setScalar(l.sc);
      if(l.tc>0||l.z<-34||mounts.length>=9)return false;
      l.ds=1;
      l.dt2=.8+.4*(1-EZ);
      const cx=Math.max(-(FX/2-8),Math.min(FX/2-8,me.x+(Math.random()-.5)*10));
      const cz=Math.max(-33,Math.min(-14,me.z-9-Math.random()*6));
      const r1=3.4+Math.random()*1.2,r2=3.4+Math.random()*1.2;
      l.sp=Math.random()<.55
        ?[{x:cx-(r1+3.4),z:cz,r:r1},{x:cx+(r2+3.4),z:cz,r:r2}]
        :[{x:cx,z:cz,r:r1+.8}];
      const grp=new THREE.Group();
      for(const sp of l.sp){
        const rg=new THREE.Mesh(
          new THREE.RingGeometry(sp.r*.85,sp.r*.88+.35,36),
          new THREE.MeshBasicMaterial({color:0xb98a4e,transparent:true,opacity:.7,side:THREE.DoubleSide})
        );
        rg.rotation.x=-Math.PI/2;
        rg.position.set(sp.x,.07,sp.z);
        grp.add(rg);
      }
      scene.add(grp);
      l.mk=grp;
    }
    l.dt2-=dt;
    const ef=Math.max(0,1-8*dt);
    l.vx*=ef;l.vz*=ef;
    u.g.scale.setScalar(l.sc*(1+.1*Math.sin(l.age*35)));
    if(l.mk)l.mk.position.z+=curSC*dt;
    if(l.dt2<=0){
      const oz=l.mk?l.mk.position.z:0;
      for(const sp of l.sp)spawnMountain(sp.x,sp.z+oz,sp.r);
      if(l.mk){scene.remove(l.mk);l.mk=null;}
      l.ds=0;
      l.tc=5+Math.random()*2+(1-EZ)*2;
      u.g.scale.setScalar(l.sc);
    }
    return true;
  }

  case 'pink': return pinkAI(l,dt,EZ,ax,az,m);

  case 'zig':{                         // weaves side to side
    const w=Math.sin(l.age*4.2+l.ph0)*26;
    l.vx+=-az/m*w*dt;
    l.vz+=ax/m*w*dt;
    return false;
  }

  case 'ghost':{                       // fades almost invisible
    const v=Math.sin(l.age*1.7+l.ph0)*.5+.5;
    u.body.material.opacity=Math.max(.07,Math.min(1,v*1.7-.15));
    return false;
  }

  case 'split':{                       // pulses, then bursts into 2 minis
    const t0=l.life*.45;
    if(l.age>t0-.5)u.g.scale.setScalar(l.sc*(1+.12*Math.sin(l.age*40)));
    if(l.age>t0&&!l.dead){
      for(let i=-1;i<=1;i+=2){
        const c=mkEnemy('mini',l.x+i*1.2,l.z);
        c.vx=i*8;
      }
      l.dead=true;
      l.r=0;
    }
    return false;
  }

  case 'tele':{                        // marks a spot, blinks there
    if(l.ds===0){
      l.tc-=dt;
      if(l.tc>0)return false;
      l.ds=1;
      l.dt2=.8+.4*(1-EZ);
      const a=Math.random()*6.28,dist=7+Math.random()*4;
      l.tx=Math.max(-(FX/2-2),Math.min(FX/2-2,me.x+Math.cos(a)*dist));
      l.tz=Math.max(-32,Math.min(-4,me.z+Math.sin(a)*dist));
      const mk=new THREE.Mesh(
        new THREE.RingGeometry(1,1.5,24),
        new THREE.MeshBasicMaterial({color:0x35d07f,transparent:true,opacity:.8,side:THREE.DoubleSide})
      );
      mk.rotation.x=-Math.PI/2;
      mk.position.set(l.tx,.07,l.tz);
      scene.add(mk);
      l.mk=mk;
    }
    l.dt2-=dt;
    l.vx*=.8;l.vz*=.8;
    l.tz+=curSC*dt;
    if(l.mk)l.mk.position.set(l.tx,.07,l.tz);
    u.g.scale.setScalar(l.sc*(.55+.45*Math.abs(Math.sin(l.age*30))));
    if(l.dt2<=0){
      l.x=l.tx;l.z=l.tz;
      l.vx=0;l.vz=0;
      if(l.mk){scene.remove(l.mk);l.mk=null;}
      l.ds=0;
      l.tc=3+Math.random()*1.5+(1-EZ)*1.5;
      u.g.scale.setScalar(l.sc);
    }
    return true;
  }

  case 'layer':{                       // leaves mines behind
    l.tc-=dt;
    if(l.tc<=0&&l.z>-34){
      l.tc=(1.2+Math.random()*.4)/EZ;
      dropMine(l.x,l.z);
    }
    return false;
  }

  case 'mag':{                         // pulls you toward it
    const d0=Math.hypot(me.x-l.x,me.z-l.z);
    if(d0<9&&d0>.01){
      const f=(1-d0/9)*6*EZ;
      me.x+=(l.x-me.x)/d0*f*dt;
      me.z+=(l.z-me.z)/d0*f*dt;
      me.x=Math.max(-(FX/2-.6),Math.min(FX/2-.6,me.x));
      me.z=Math.max(-31,Math.min(-3,me.z));
    }
    return false;
  }

  case 'stomp':{                       // slams the ground: expanding shockwave
    if(l.ds===0){
      l.tc-=dt;
      u.g.scale.setScalar(l.sc);
      if(l.tc>0)return false;
      l.ds=1;
      l.dt2=.6;
    }
    l.dt2-=dt;
    const f=Math.max(0,1-8*dt);
    l.vx*=f;l.vz*=f;
    u.g.scale.setScalar(l.sc*(1+.1*Math.sin(l.age*40)));
    if(l.dt2<=0){
      dropWave(l.x,l.z);
      l.ds=0;
      l.tc=3.2+Math.random()+(1-EZ)*1.5;
      u.g.scale.setScalar(l.sc);
    }
    return true;
  }
  }
  return false;
}

/* ===== MOUNTAINS & MECH SHOTS ===== */
let mounts=[],shots=[];

function spawnMountain(x,z,r){
  const g=new THREE.Group();
  const h=7+r*1.4;

let stun=0,bolts=[],bombs=[],smokes=[],flashV=0;
const AURA_R=7,SMOKE_R=6,ZAP_R=5;
const flashEl=$('#flash');

function zigzag(ax,ay,az,bx,by,bz,steps,jit,th,col,life){
  const g=new THREE.Group();
  let px=ax,py=ay,pz=az;
  for(let i=1;i<=steps;i++){
    const t=i/steps,last=i===steps;
    const nx=last?bx:ax+(bx-ax)*t+(Math.random()-.5)*jit;
    const ny=ay+(by-ay)*t;
    const nz=last?bz:az+(bz-az)*t+(Math.random()-.5)*jit;
    const dir=new THREE.Vector3(nx-px,ny-py,nz-pz);
    const len=dir.length()||.001;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(th,len,th),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1})
    );
    m.position.set((px+nx)/2,(py+ny)/2,(pz+nz)/2);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
    g.add(m);
    px=nx;py=ny;pz=nz;
  }
  scene.add(g);
  bolts.push({g,t:0,life:life||.4});
}

function lightning(){
  const R=16;
  for(const l of lbs){
    if(l.dead)continue;
    if(Math.hypot(l.x-me.x,l.z-me.z)<R){
      zigzag(l.x,24,l.z,l.x,0,l.z,7,2.5,.35,0xcfe8ff,.45);
      for(let i=0;i<10;i++){
        const m=new THREE.Mesh(gSpark,mSpark[i%2]);
        m.position.set(l.x,1.5,l.z);
        scene.add(m);
        parts.push({m,vx:(Math.random()-.5)*10,vy:Math.random()*8+2,vz:(Math.random()-.5)*10,life:1});
      }
      l.dead=true;
      l.r=0;
    }
  }
  flashV=.8;
  shake=Math.max(shake,.6);
}

function throwBomb(l){
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(.45,10,8),
    new THREE.MeshLambertMaterial({color:0x2a2d33,emissive:0x33363d})
  );
  const mk=new THREE.Mesh(
    new THREE.RingGeometry(SMOKE_R-.3,SMOKE_R,40),
    new THREE.MeshBasicMaterial({color:0x9aa0aa,transparent:true,opacity:.5,side:THREE.DoubleSide})
  );
  mk.rotation.x=-Math.PI/2;
  const tx=me.x,tz=me.z;
  mk.position.set(tx,.06,tz);
  scene.add(mesh,mk);
  bombs.push({sx:l.x,sz:l.z,tx,tz,t:0,mesh,mk});
}

/* Renders a small 3D portrait of every enemy once, using a throwaway renderer. */
let bookImgs=null;
function makeBookImgs(){
  if(bookImgs)return bookImgs;
  bookImgs={};
  let r2;
  try{
    r2=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
    r2.setPixelRatio(1);
    r2.setSize(112,140);
    r2.setClearColor(0x000000,0);
    const sc3=new THREE.Scene();
    sc3.add(new THREE.HemisphereLight(0xc8dcff,0x3a5a40,1.1));
    const dl=new THREE.DirectionalLight(0xffffff,.9);
    dl.position.set(4,10,8);
    sc3.add(dl);
    const cm=new THREE.PerspectiveCamera(30,112/140,.1,100);
    for(const b of BOOK){
      const kind=BOOK_KIND[b[0]];
      if(!kind)continue;
      const T=TYPES[kind]();
      const root=mkPlayer(T.m,helmD,pantsD,T.sc);
      if(kind==='mech')addMechParts(root.userData.g);
      root.rotation.y=-.55;
      sc3.add(root);
      const d=6.6*T.sc;
      cm.position.set(d*.3,1.9*T.sc+d*.12,d*.94);
      cm.lookAt(0,1.55*T.sc,0);
      r2.render(sc3,cm);
      bookImgs[b[0]]=r2.domElement.toDataURL('image/png');
      sc3.remove(root);
    }
  }catch(e){}
  if(r2){
    r2.dispose();
    try{r2.forceContextLoss();}catch(e){}
  }
  return bookImgs;
}

function openBook(){
  const imgs=makeBookImgs();
  const css=h=>'#'+h.toString(16).padStart(6,'0');

    '<div class="t">'+b[0]+'<small>Level '+b[2]+'+ · '+b[3]+'</small></div></div>'
  ).join('');

function blastAt(x,z,rad){
  for(const l of lbs){
    const dx=l.x-x,dz=l.z-z,d=Math.hypot(dx,dz)||1;
    if(d<rad){
      l.vx=dx/d*22;
      l.vz=dz/d*22;
      if(!l.tired){l.tired=true;tire(l);}
    }
  }
  mines=mines.filter(mn=>{
    const keep=Math.hypot(mn.x-x,mn.z-z)>=rad;
    if(!keep)scene.remove(mn.mesh);
    return keep;
  });
  const mesh=new THREE.Mesh(
    new THREE.RingGeometry(.85,1,40),
    new THREE.MeshBasicMaterial({color:0x7be3ff,transparent:true,opacity:.9,side:THREE.DoubleSide})
  );

function usePower(k){

  if(k==='shield'&&pw.shield)return;
  stock[k]--;
  saveEco();
  if(k==='shield')pw.shield=true;
  else if(k==='freeze')pw.freeze=4;
  else if(k==='slow')pw.slow=6;
  else if(k==='boost')pw.boost=5;
  else if(k==='agi')pw.agi=10;
  else if(k==='aura')pw.aura=10;
  else if(k==='bolt')lightning();
  else if(k==='blast'){blastAt(me.x,me.z,14);shake=Math.max(shake,.5);}
  banner(POW[k].i+' '+POW[k].n.toUpperCase());

/* MAIN GAME LOOP */

const frame=now=>{
  const dt=Math.min(.05,(now-last)/1000)||.016;
  last=now;
  tm+=dt;

  let mvx=0,hit=false,near=99;

  if(run){
    const SC=4+Math.min(3,yd/80);
    curSC=SC;

    /* EASING: ramps from 0.65 to 1.0 by 350 yards (level 15) */
    const EZ=Math.min(1,.65+.35*yd/350);

    /* POWER-UP TIMERS */
    for(const k of ['freeze','slow','boost','agi','aura'])pw[k]=Math.max(0,pw[k]-dt);
    inv=Math.max(0,inv-dt);
    const tScale=pw.freeze>0?0:pw.slow>0?.4:1;
    tSg=tScale;

    const px=me.x,pz=me.z;
    const dx=tgt.x-me.x,dz=tgt.z-me.z;
    const d=Math.hypot(dx,dz);
    const st=pw.agi>0?1e9:22*dt*(pw.boost>0?1.7:1); /* agility: snap straight to the cursor */

    if(stun>0){stun-=dt;}else if(d<=st){
      me.x=tgt.x;
      me.z=tgt.z;
    }else{
      me.x+=dx/d*st;
      me.z+=dz/d*st;
    }

    mvx=Math.max(-40,Math.min(40,(me.x-px)/dt));
    const mvz=Math.max(-40,Math.min(40,(me.z-pz)/dt));

    const yd0=yd;
    yd+=dt*(4+Math.min(1,Math.max(0,(-me.z-2)/28))*4);
    runCoins+=(yd-yd0)/4*(pw.boost>0?2:1);
    scroll(dt*SC);

    const nl=levelOf(yd);

    if(nl>lvl){
      lvl=nl;
      banner('LEVEL '+lvl,NEW[lvl]);
    }

    spawn-=dt*tScale;

    if(spawn<=0){
      spawn=Math.max(.4,1.9-yd/150)/(.5+.5*EZ);

      for(
        let i=0,
        n=1+(Math.random()<Math.min(.4,Math.max(0,yd-200)/300)
          ?1+rnd(1+Math.floor(yd/300)):0);
        i<n;
        i++
      ){
        const side=Math.random()<.35;
        mkEnemy(pickKind(),
          side?camX+(Math.random()<.5?-1:1)*(camHW+1.5):camX+(Math.random()-.5)*camHW*2,
          side?-12-Math.random()*26:spawnZ);
      }
    }

    /* MOUNTAINS */
    for(const mt of mounts){
      mt.age+=dt;
      mt.z+=SC*dt;
      const rise=Math.min(1,mt.age/.9);
      mt.mesh.scale.y=Math.max(.01,1-Math.pow(1-rise,3));
      mt.mesh.position.set(mt.x,0,mt.z);
      if(mt.age>.45){
        const mr=mt.r*.88+.7,mx=me.x-mt.x,mz=me.z-mt.z,md=Math.hypot(mx,mz)||1;
        if(md<mr){me.x=mt.x+mx/md*mr;me.z=mt.z+mz/md*mr;}
      }
    }
    mounts=mounts.filter(mt=>{
      const k=mt.z<mt.r+14;
      if(!k)scene.remove(mt.mesh);
      return k;
    });
    me.x=Math.max(-(FX/2-.6),Math.min(FX/2-.6,me.x));
    me.z=Math.max(-31,Math.min(4,me.z));

    const cap=Math.min(17,6+yd*.06)*EZ;
    const lead=Math.min(.5,.1+yd/400)*EZ;

    const rdt=dt;
    for(const l of lbs){
      const dt=rdt*tScale*(pw.aura>0&&Math.hypot(me.x-l.x,me.z-l.z)<AURA_R?.3:1);
      l.age+=dt;

      const ld=l.pred?lead:0;
      const ax=me.x+mvx*ld-l.x;
      const az=me.z+mvz*ld-l.z;
      const m=Math.hypot(ax,az)||1;

      if(!l.tired&&(l.age>l.life||(l.fade&&l.z>me.z+1.7))){
        l.tired=true;
        tire(l);
      }

      if(l.tired){
        const f=Math.max(0,1-1.6*dt);
        l.vx*=f;
        l.vz*=f;
      }else if(special(l,dt,EZ,ax,az,m)){
        /* pink is winding up or dashing */
      }else{
        const acc=(8+yd*.06)*l.k*EZ;
        l.vx+=ax/m*acc*dt;
        l.vz+=az/m*acc*dt;

        for(const o of lbs){
          if(o===l)continue;

          const sx=l.x-o.x;
          const sz=l.z-o.z;
          const sd=Math.hypot(sx,sz);

          if(sd>0&&sd<2){
            l.vx+=sx/sd*14.6*dt;
            l.vz+=sz/sd*14.6*dt;
          }
        }
      }

      const s=Math.hypot(l.vx,l.vz);
      const lc=cap*l.k;

      if(l.ds!==2&&!l.tired&&s>lc){
        l.vx*=lc/s;
        l.vz*=lc/s;
      }

      l.x+=l.vx*dt;
      l.z+=l.vz*dt+SC*rdt;
      for(const mt of mounts){
        if(mt.age<.45)continue;
        const mr=mt.r*.88+.8,mx=l.x-mt.x,mz=l.z-mt.z,md=Math.hypot(mx,mz)||1;
        if(md<mr){l.x=mt.x+mx/md*mr;l.z=mt.z+mz/md*mr;}
      }

      const dd=Math.hypot(me.x-l.x,me.z-l.z);
      near=Math.min(near,dd-l.r+1.5);

      if(dd<l.r)hit=true;
    }

    /* MECH SHOTS */
    for(const sh of shots){
      const sd2=dt*tScale;
      sh.age+=sd2;
      sh.x+=sh.vx*sd2;
      sh.z+=sh.vz*sd2+SC*dt;
      sh.mesh.position.set(sh.x,1.8,sh.z);
      for(const mt of mounts){
        if(mt.age<.45)continue;
        if(Math.hypot(sh.x-mt.x,sh.z-mt.z)<mt.r*.88){sh.dead=true;break;}
      }
      if(sh.dead)continue;
      const sd=Math.hypot(me.x-sh.x,me.z-sh.z);
      near=Math.min(near,sd-.9+1.5);
      if(sd<.9){hit=true;sh.dead=true;}
    }
    shots=shots.filter(sh=>{
      const k=!sh.dead&&sh.age<4&&sh.z<10&&Math.abs(sh.x-camX)<camHW+20;
      if(!k)scene.remove(sh.mesh);
      return k;
    });

    /* SMOKE BOMBS */
    for(const b of bombs){
      b.t+=dt/.9;
      b.sz+=SC*dt;b.tz+=SC*dt;
      const k=Math.min(1,b.t);
      b.mesh.position.set(
        b.sx+(b.tx-b.sx)*k,
        1.5+24*k*(1-k),
        b.sz+(b.tz-b.sz)*k
      );
      b.mk.position.set(b.tx,.06,b.tz);
      if(k>=1){
        spawnSmoke(b.tx,b.tz);
        scene.remove(b.mesh);scene.remove(b.mk);
        b.done=true;
      }
    }
    bombs=bombs.filter(b=>!b.done);

    for(const sm of smokes){
      sm.age+=dt;
      sm.z+=SC*dt;
      const grow=Math.min(1,sm.age/.4);
      sm.mesh.scale.set(Math.max(.01,grow),1,Math.max(.01,grow));
      sm.mesh.position.set(sm.x,5,sm.z);
      sm.mesh.material.opacity=.95*Math.max(0,Math.min(1,sm.life-sm.age));
    }
    smokes=smokes.filter(sm=>{
      const k=sm.age<sm.life&&sm.z<SMOKE_R+10;
      if(!k)scene.remove(sm.mesh);
      return k;
    });

    /* MINES */
    for(const mn of mines){
      mn.age+=dt;
      mn.z+=SC*dt;
      mn.mesh.position.set(mn.x,.17,mn.z);
      const armed=mn.age>.8;
      mn.mesh.material.emissive.setHex(Math.sin(mn.age*(armed?10:25))>0?0xff2200:0x220000);
      const md=Math.hypot(me.x-mn.x,me.z-mn.z);
      near=Math.min(near,md-mn.r+1.5);
      if(armed&&md<mn.r)hit=true;
    }
    mines=mines.filter(mn=>{
      const k=mn.age<9&&mn.z<7;
      if(!k)scene.remove(mn.mesh);
      return k;
    });

    /* SHOCKWAVES */
    for(const w of waves){
      w.r+=(9+2*EZ)*dt*tScale;
      w.z+=SC*dt;
      w.mesh.position.set(w.x,.08,w.z);
      w.mesh.scale.set(w.r,w.r,1);
      w.mesh.material.opacity=Math.max(0,.9*(1-w.r/14));
      const wd=Math.hypot(me.x-w.x,me.z-w.z);
      if(wd<w.r+.3&&wd>w.r*.88-.3)hit=true;
    }
    waves=waves.filter(w=>{
      const k=w.r<14;
      if(!k)scene.remove(w.mesh);
      return k;
    });

    lbs=lbs.filter(l=>{
      const keep=!l.dead&&l.z<7&&Math.abs(l.x-camX)<camHW+10;
      if(!keep){scene.remove(l.mesh);if(l.mk)scene.remove(l.mk);}
      return keep;
    });

  }else if(!over){
    scroll(dt*1.5);
  }

  /* DEFENDER ANIMATION */

  for(const l of lbs){
    const u=l.mesh.userData;
    const sp=run?Math.hypot(l.vx,l.vz+5)*tSg:0;

    l.ph+=dt*sp*.95;

    const sw=Math.sin(l.ph)*Math.min(1,sp/5)*.9;

    u.legs[0].rotation.x=sw;
    u.legs[1].rotation.x=-sw;
    u.arms[0].rotation.x=-sw*.8;
    u.arms[1].rotation.x=sw*.8;

    if(run&&sp>.5){
      l.mesh.rotation.y=Math.atan2(-l.vx,-(l.vz+5));
    }

    l.mesh.position.set(l.x,0,l.z);
  }

  /* PLAYER ANIMATION */

  const pu=me3.userData;
  const ps=run?1:.12;
  const sw=Math.sin(tm*14)*.9*ps;

  pu.legs[0].rotation.x=sw;
  pu.legs[1].rotation.x=-sw;
  pu.arms[0].rotation.x=-sw;
  pu.arms[1].rotation.x=-.9;

  pu.g.position.y=run?Math.abs(Math.sin(tm*14))*.12:0;

  me3.rotation.y=Math.max(-.6,Math.min(.6,-mvx*.045));
  pu.g.rotation.z=Math.max(-.35,Math.min(.35,-mvx*.03));

  if(over){
    fall=Math.min(1.45,fall+dt*3.2);
    pu.g.rotation.x=-fall;
    pu.g.position.y=-fall*.15;
  }else{
    pu.g.rotation.x=0;
  }

  me3.position.set(me.x,0,me.z);
  shieldMesh.visible=run&&((pw.shield&&inv<=0)||(inv>0&&Math.sin(tm*40)>0));

  auraG.visible=run&&pw.aura>0;
  if(auraG.visible){
    const ak=1+.05*Math.sin(tm*6);
    auraG.scale.set(ak,1,ak);
    auraRing.material.opacity=.4+.25*Math.sin(tm*6);
  }
  bolts=bolts.filter(b=>{
    b.t+=dt;
    const k=b.t/b.life;
    b.g.children.forEach(c=>c.material.opacity=Math.max(0,1-k));
    if(k>=1){scene.remove(b.g);return false;}
    return true;
  });
  flashV=Math.max(0,flashV-dt*3);
  flashEl.style.opacity=flashV.toFixed(2);

  fxs=fxs.filter(f=>{
    f.t+=dt;
    const k=Math.min(1,f.t/.5);
    const sc=.01+f.rad*k;
    f.mesh.scale.set(sc,sc,1);
    f.mesh.material.opacity=.9*(1-k);
    if(k>=1){scene.remove(f.mesh);return false;}
    return true;
  });

  const fxc=pw.freeze>0?'rgba(120,220,255,.22)':pw.slow>0?'rgba(170,120,255,.2)':pw.boost>0?'rgba(255,215,90,.16)':pw.agi>0?'rgba(120,255,160,.16)':pw.aura>0?'rgba(90,230,200,.14)':'';
  fxEl.style.background=fxc;
  fxEl.style.opacity=run&&fxc?1:0;

  /* PARTICLES */

  parts=parts.filter(p=>{
    p.vy-=22*dt;

    const q=p.m.position;
    q.x+=p.vx*dt;
    q.y+=p.vy*dt;
    q.z+=p.vz*dt;

    if(q.y<.1){
      q.y=.1;
      p.vy*= -.3;
    }

    p.life-=dt;
    p.m.scale.setScalar(Math.max(.01,p.life));

    if(p.life<=0){
      scene.remove(p.m);
      return false;
    }

    return true;
  });

  /* CAMERA */

  const lim=Math.max(0,FX/2-camHW+2);
  const want=Math.max(-lim,Math.min(lim,me.x));

  camX+=(want-camX)*Math.min(1,dt*5);

  cam.position.set(camX,camH,-7);

  if(shake>.02){
    cam.position.x+=(Math.random()-.5)*shake;
    cam.position.y+=(Math.random()-.5)*shake;
    shake*=.88;
  }

  cam.lookAt(camX,0,-17);
  cam.updateMatrixWorld();

  /* UPDATE OFF-SCREEN ARROWS */
  updateArrows();

  /* HUD */

  $('#danger').style.opacity=run
    ?Math.max(0,Math.min(.9,1-near/4.5)).toFixed(2)
    :0;

  const key=Math.floor(yd)+'|'+lvl;
  if(run&&key!==hk)showCoins();

  if(key!==hk){
    hk=key;
    $('#yd').textContent=Math.floor(yd);
    $('#lv').textContent='LEVEL '+lvl;
  }

  renderer.render(scene,cam);

  if(hit&&run){
    if(inv>0){/* invulnerable */}
    else if(pw.shield){
      pw.shield=false;
      inv=1.6;
      blastAt(me.x,me.z,9);
      shake=.7;
      banner('SHIELD BROKE');
    }else finish();
  }

  requestAnimationFrame(frame);
};

applySkin();
showCoins();
title();
last=performance.now();
requestAnimationFrame(frame);

</script>
</body>
</html>
